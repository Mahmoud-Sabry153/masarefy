name: masarefy
description: "Masarefy — a private, offline expense & budget planner with a dark neon UI. No login, no server: everything is stored on your device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management: ChangeNotifier-based MVVM (see docs/design_pattern.md)
  provider: ^6.1.2

  # On-device storage: fast NoSQL key-value boxes, no server, no login.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Formatting dates and currency amounts.
  intl: ^0.19.0

  # Generating unique local ids for billing items without a backend.
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
