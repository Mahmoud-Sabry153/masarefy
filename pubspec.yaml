name: masarefy
description: "Masarefy — a private, offline expense & budget planner with a dark neon UI. No login, no server: everything is stored on your device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management: ChangeNotifier-based MVVM (see docs/design_pattern.md)
  provider: ^6.1.2

  # On-device storage: fast NoSQL key-value boxes, no server, no login.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Formatting dates and currency amounts.
  intl: ^0.19.0

  # Generating unique local ids for billing items without a backend.
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates the real per-platform app icon files (Android mipmaps +
  # adaptive icon, iOS AppIcon.appiconset) from the two master images in
  # assets/icon/ — see the "App icon" section in docs/design_pattern.md.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Config for flutter_launcher_icons (run: dart run flutter_launcher_icons).
# icon.png is the full-bleed square used for iOS and legacy Android icons;
# icon_foreground.png is the same "M" mark on a transparent background,
# sized to Android's adaptive-icon safe zone, paired with a flat
# background color so the OS can animate/mask it (parallax, shape mask,
# themed icon, etc.) instead of masking a flat image.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0D14"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
